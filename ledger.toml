# The meshes plugin's rows of the SceneDB closure ledger (Pulsar-Native#1035):
# its classes, GPU schemas, buffers, pass crates and call sites. A plugin owns
# the rows of what it ships (Pulsar-Native#1606); `cargo test -p scene_inventory`
# in a Pulsar-Native checkout recomputes every fact column, checks the human
# columns, and fails on a missing, stale or misplaced row. The columns are
# described in Pulsar-Native's crates/core/scene_inventory/ledger.toml.

# ── Exposed component classes ───────────────────────────────────

[[class]]
name = "LODComponent"
category = "Rendering"
world_registered = true
own_gpu_columns = true
owner = "meshes_component::components::lod_component"
disposition = "render, Phase 4: each render view selects an authored mesh asset by camera distance and bias, requests its SceneDB residency, leases shared GPU geometry while selected, and patches static draw rows. A generation marker rebuilds draw grouping when selection or residency changes; an unavailable level falls back to the base static mesh. Independent of meshlet/virtual-geometry LOD"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/installed/tests/render_acceptance.rs (authored_mesh_lod_changes_with_distance_and_bias_and_disabling_restores_base_mesh)"
status = "verified"

[[class]]
name = "VirtualGeometryComponent"
category = "Rendering"
world_registered = true
own_gpu_columns = true
owner = "meshes_component::components::virtual_geometry_component"
disposition = "render, virtual geometry (.agents/plans/virtual-geometry.md): optional per-instance overrides (enabled, tier lock, lod error scale, force root only, shadow caster) for a static mesh's virtual-geometry rendering; a mesh without it uses the global defaults. Its derived VgOverrideGpu row is written on every insert, write, removal and replay; the VirtualGeometryInstances derivation joins it on the GPU to the owner's mesh instances. A VG-active instance's authored LODComponent is inert (plan item 7). The default deferred graph draws it (helio-presets virtual_geometry): VirtualGeometryHost builds and streams the mesh's .vgeo, and the cluster passes shade into the G-buffer. Not declared unfinished (no tracking issue)"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/meshes/component/src/components/virtual_geometry_component.rs (tests); plugins/vendor/meshes/tests/virtual_geometry_instances_gpu.rs; plugins/installed/tests/virtual_geometry_acceptance.rs"
status = "verified"

[[class]]
name = "SkeletalMeshComponent"
category = "Rendering"
world_registered = true
own_gpu_columns = true
owner = "meshes_component::components::skeletal_mesh_component"
disposition = "render: a skinned mesh named by a typed asset id that SceneDB loads and binds; it writes the shared mesh pools plus its skin stream and bone palette, and a derived StaticMeshDraw row, so the scene join draws it like a static mesh with the palette applied in mesh space. It shows the pose its animator gives it (helio_component::skinning::SkinnedMeshAccess), its bind pose without one"
target_contract = "SceneDB#84; 03-gpu-reflection-and-rendering.md"
test = "none: no test covers SkeletalMeshComponent yet; the rigged import is covered by plugins/vendor/meshes/tests/import_rigged_import.rs"
status = "unverified"

[[class]]
name = "StaticMeshComponent"
category = "Rendering"
world_registered = true
own_gpu_columns = true
owner = "meshes_component::components::static_mesh_component"
disposition = "render: its pools and derived draw rows (static_mesh_draw_*) follow every write; the scene join builds draw and material rows on the GPU (Phase 2)"
target_contract = "Phase 2; 03-gpu-reflection-and-rendering.md"
test = "plugins/installed/tests/render_acceptance.rs (meshes_and_lights_reach_the_frame_from_every_producer)"
status = "verified"
notes = "Phase 0's failures (no draw row when added after the first frame, panel ordering) are covered by the Phase 2 rendered-frame cases (13-phase-2.md)."

# ── GPU-bearing schemas ─────────────────────────────────────────

[[schema]]
type = "StaticMeshDraw"
path = "meshes_component::components::static_mesh_draw::StaticMeshDraw"
buffers = ["static_mesh_draw_bounds", "static_mesh_draw_flags", "static_mesh_draw_sections"]
clears_on_remove = false
releases_var_len = true
registered = true
writer = "StaticMeshComponent's second GPU registration (bounds, movable flag, sections with materials resolved from the slots), on every insert, write, removal and replay"
owner = "meshes_component::components::static_mesh_draw"
disposition = "keep: the scene join's per-instance mesh draw input (Phase 2)"
target_contract = "Phase 2; 03-gpu-reflection-and-rendering.md"
test = "plugins/vendor/meshes/tests/scene_join_rows.rs"
status = "verified"

[[schema]]
type = "MeshMaterialRows"
path = "meshes_component::mesh_materials::MeshMaterialRows"
buffers = ["mesh_material_rows"]
clears_on_remove = false
releases_var_len = true
registered = false
writer = "MeshMaterialInstances (a scene subsystem), only when a mesh's slots change"
owner = "meshes_component::mesh_materials"
disposition = "keep: a mesh's slot table beside the mesh, so assigning a material never rewrites the mesh's geometry rows"
target_contract = "p17; plugin-migration.md (material instances)"
test = "plugins/vendor/meshes/tests/scene_join_rows.rs"
status = "verified"

[[schema]]
type = "SkeletalMeshComponent"
path = "meshes_component::components::skeletal_mesh_component::SkeletalMeshComponent"
buffers = ["builtin_mesh_index", "builtin_mesh_vertex", "skeletal_bone_palette", "skeletal_skin_vertices"]
clears_on_remove = true
releases_var_len = true
registered = true
writer = "its own SceneDB dispatch (geometry in the shared mesh pools, skin vertices, current and previous bone palettes) and the derived StaticMeshDraw registration (bounds, movable flag, one section per mesh section), on every insert, write, removal and replay"
owner = "meshes_component::components::skeletal_mesh_component"
disposition = "keep: the authored skinned mesh instance; the scene join draws it from its own rows joined to its owner"
target_contract = "SceneDB#84; 03-gpu-reflection-and-rendering.md"
test = "none: no test covers SkeletalMeshComponent yet; the rigged import is covered by plugins/vendor/meshes/tests/import_rigged_import.rs"
status = "unverified"

[[schema]]
type = "StaticMeshComponent"
path = "meshes_component::components::static_mesh_component::StaticMeshComponent"
buffers = ["builtin_mesh_index", "builtin_mesh_vertex"]
clears_on_remove = true
releases_var_len = true
registered = true
writer = "its own SceneDB dispatch (content-interned geometry) and the derived StaticMeshDraw registration (bounds, movable flag, sections with resolved materials), on every insert, guarded write, removal and replay; a mesh_asset write names the mesh by AssetId and SceneDB's asset table loads the geometry off the write path and binds it; each slot's material is counted as a reference by the handle collector and bound into `materials` the same way, and the draw reads only what was bound (SceneDB#84)"
owner = "meshes_component::components::static_mesh_component"
disposition = "keep: the authored mesh instance; the scene join draws it from its own rows joined to its owner (Phase 2)"
target_contract = "Phase 2; 03-gpu-reflection-and-rendering.md"
test = "plugins/installed/tests/render_acceptance.rs"
status = "verified"

[[schema]]
type = "VirtualGeometryComponent"
path = "meshes_component::components::virtual_geometry_component::VirtualGeometryComponent"
buffers = ["vg_instance_overrides"]
clears_on_remove = false
releases_var_len = true
registered = true
writer = "its own SceneDB var-len dispatch: one VgOverrideGpu row (authored flags, tier lock, sanitised error scale) refreshed on decode and on every write of an authored property, freed on removal"
owner = "meshes_component::components::virtual_geometry_component"
disposition = "keep: the per-instance virtual-geometry overrides; the VirtualGeometryInstances derivation reads them (vg_instance_overrides, vg_instance_overrides::handles)"
target_contract = "Phase 4; 03-gpu-reflection-and-rendering.md"
test = "plugins/vendor/meshes/tests/virtual_geometry_instances_gpu.rs"
status = "unverified"

[[schema]]
type = "LODComponent"
path = "meshes_component::components::lod_component::LODComponent"
buffers = ["lod_component_levels"]
clears_on_remove = false
releases_var_len = true
registered = true
writer = "its component's GPU registration, on every insert, write, removal and replay"
owner = "meshes_component::components::lod_component"
disposition = "keep: the kind's own, moved with it into its plugin (plugin-migration.md Phases B and C)"
target_contract = "Phase C; plugin-migration.md"
test = "none: no test names this row; the owning plugin's suites cover its behaviour"
status = "unverified"

