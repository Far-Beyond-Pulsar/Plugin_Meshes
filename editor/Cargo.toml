[package]
name = "meshes_editor"
version = "0.1.0"
edition = "2024"
description = "Meshes (pulsar.meshes): the editor crate -- the level editor's mesh entries and icon and the asset browser's mesh thumbnails, over the plugin's component crate"

[lib]
name = "meshes_editor"

[dependencies]
meshes_component = { workspace = true }
# The level editor UI the root registers through its extension points
# (`ui_level_editor::extend`).
ui_level_editor = { workspace = true }
ui = { workspace = true }
pulsar_scene_model = { workspace = true }
pulsar_scenedb = { workspace = true }
gpui-ce = { workspace = true }
rust-i18n = { workspace = true }
# Asset-browser thumbnails (`thumbnails`): source models through the
# meshes' snapshot renderer, `.mesh` files rasterised on the CPU.
ui_common = { workspace = true }
helio_snapshot = { workspace = true }
image = { workspace = true }
glam = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
helio-mesh-api = { workspace = true }

[lints]
workspace = true
